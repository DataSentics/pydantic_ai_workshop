[project]
name = "pydantic-ai-workshop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Danil Semin", email = "danil.semin@datasentics.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=1.86.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.6.0",
    "pydantic-evals>=1.86.0",
    "logfire>=4.0.0",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.9.0",
    "mcp>=1.10.0",
    "aiosqlite>=0.20.0",
    "rich>=15.0.0",
    "ipykernel>=7.2.0",
    "pillow>=11.0.0",
    "fasta2a>=0.6.1",
    "idna>=3.15",
]

[project.scripts]
pydantic-ai-workshop = "pydantic_ai_workshop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
